name: ci

# Owner's decision (2026-11-11): run CI only when it matters. The private repo's free Actions
# minutes ran out (Windows minutes count 2x, macOS 10x), so:
# - a push to build/integration that changes code runs Windows only (the release platform),
#   release tests only; documentation, demo and Markdown-only pushes run nothing;
# - the full check (Linux, Windows, macOS, debug and release tests, wasm32) runs only when started
#   by hand: Actions -> ci -> Run workflow (or `gh workflow run ci --ref build/integration`),
#   at phase exits and before a release.
# Every package's checks also run locally before it is merged.
on:
  push:
    branches: [build/integration]
    paths-ignore:
      - 'docs/**'
      - 'demos/**'
      - '**/*.md'
      - 'app/screenshots/**'
      - 'crates/praxis-app/screenshots/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # cpal needs ALSA; praxis-app (Tauri 2, a workspace member that lint and tests build)
      # needs WebKitGTK, GTK 3 and their companions on Linux.
      - name: Linux system libraries (cpal, Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets
      - name: Test (debug, full check only)
        if: github.event_name == 'workflow_dispatch'
        run: cargo test --workspace
      - name: Test (release)
        run: cargo test --workspace --release
      - name: Schemas are current
        run: |
          cargo run -q -p praxis-cli -- schema --write
          git diff --exit-code schema/
      - name: Phase 0 exit - empty score renders to a silent WAV
        shell: bash
        run: |
          cargo run -q --release -p praxis-cli -- --json render fixtures/empty.score.json -o empty.wav
          test -s empty.wav

  wasm:
    name: wasm32 build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p praxis-wasm --target wasm32-unknown-unknown --release
