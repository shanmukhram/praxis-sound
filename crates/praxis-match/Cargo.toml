[package]
name = "praxis-match"
description = "Profile-to-Score mapping and analysis-by-synthesis optimizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
praxis-score.workspace = true
praxis-dsp.workspace = true
praxis-engine.workspace = true
# No pack installer (ureq, 7z): the matcher stays WebAssembly-safe.
praxis-instruments = { workspace = true, default-features = false }
praxis-analyze.workspace = true
# The planner's validation, repairs and arranger turn the matched ScorePlan into a Score; without
# the `claude` feature (no network, no keychain).
praxis-planner = { workspace = true, default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
[dev-dependencies]

[lints]
workspace = true
