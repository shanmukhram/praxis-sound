[package]
name = "praxis-cli"
description = "Headless generate, analyse and render commands with JSON in and out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The command layer (`praxis_cli::ops`) is a library so the CLI and the MCP server (WP-X) share
# one implementation of every command.
[lib]
name = "praxis_cli"
path = "src/lib.rs"

[[bin]]
name = "praxis"
path = "src/main.rs"

[dependencies]
praxis-score.workspace = true
praxis-dsp.workspace = true
praxis-engine.workspace = true
praxis-instruments.workspace = true
praxis-audio-io = { workspace = true, default-features = false }
praxis-analyze.workspace = true
praxis-match.workspace = true
praxis-planner.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
# `key clear` deletes the keychain entry (the planner only reads and stores it).
keyring.workspace = true

[dev-dependencies]
praxis-testkit.workspace = true

[lints]
workspace = true
