[package]
name = "praxis-instruments"
description = "SFZ and SoundFont loading, sampler, synth presets, drums, SFX patches, packs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
praxis-score.workspace = true
praxis-dsp.workspace = true
praxis-engine.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
claxon.workspace = true
hound.workspace = true
blake3.workspace = true
sevenz-rust2 = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[features]
default = ["install"]
# Downloading and unpacking packs (desktop/CLI only, not WebAssembly).
install = ["dep:sevenz-rust2", "dep:ureq"]
[dev-dependencies]
praxis-testkit.workspace = true
[lints]
workspace = true
