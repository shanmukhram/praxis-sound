[package]
name = "praxis-app"
description = "The Praxis Sound desktop app: a Tauri 2 shell over the shared command layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A library (the commands, testable without a window) plus the desktop binary. Kept out of the
# workspace's default-members (ADR-0002) so core builds stay fast.
[lib]
name = "praxis_app"
path = "src/lib.rs"

[[bin]]
name = "praxis-app"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
praxis-cli.workspace = true
praxis-score.workspace = true
praxis-engine.workspace = true
praxis-audio-io.workspace = true
praxis-instruments.workspace = true
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
