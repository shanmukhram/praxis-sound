# Licence and supply-chain audit (WP-Z): `cargo deny check`.
# Permissive licences only (ADR-0008, docs/NEEDS_OWNER.md); every component is listed with its
# licence in THIRD_PARTY.md.

[graph]
# Audit every platform the code builds for: Windows (release target), macOS and Linux (CI),
# and the browser build.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "wasm32-unknown-unknown",
]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    # webpki-roots: the Mozilla CA list as data, CDLA-Permissive-2.0 (permissive, no copyleft).
    "CDLA-Permissive-2.0",
    # bzip2's own BSD-style licence (libbz2, through the 7z pack unpacker).
    "bzip2-1.0.6",
]
# MPL-2.0 is refused (ADR-0008) except for these crates, which come only through the Tauri
# desktop shell (praxis-app): tauri-utils' HTML handling (dom_query -> selectors, cssparser) and
# tauri's home-folder lookup (dirs -> dirs-sys -> option-ext). All are used unmodified from
# crates.io; MPL-2.0 is file-level copyleft, so it covers only these crates' own files. None is
# reachable from the core crates (score, dsp, engine, instruments, analyze, match, planner) or
# praxis-wasm: checked with `cargo tree -i <crate>` per crate (docs/release/licences.md).
# Provisionally approved by the orchestrator (2026-11-12); the owner's licence decision at
# release covers it (docs/NEEDS_OWNER.md).
exceptions = [
    { crate = "cssparser@0.37.0", allow = ["MPL-2.0"] },
    { crate = "cssparser@0.38.0", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros@0.7.1", allow = ["MPL-2.0"] },
    { crate = "dtoa-short@0.3.5", allow = ["MPL-2.0"] },
    { crate = "selectors@0.38.0", allow = ["MPL-2.0"] },
    { crate = "selectors@0.41.0", allow = ["MPL-2.0"] },
    { crate = "option-ext@0.2.0", allow = ["MPL-2.0"] },
]

[licenses.private]
# The workspace's own crates (publish = false, licence pending the owner's decision).
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
yanked = "warn"
# Unmaintained notices fail only for crates the workspace depends on directly; transitive ones
# (zbus parts through keyring on Linux, proc-macro-error through gtk) are listed in
# docs/release/licences.md. Vulnerability advisories always fail.
unmaintained = "workspace"
